<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 1rem; }
.cal { width: 100%; max-width: 320px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.cal-title { font-size: 14px; font-weight: 500; color: #fff; letter-spacing: 0.06em; }
.cal-nav button { background: none; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 12px; color: rgba(255,255,255,0.6); }
.cal-nav button:hover { background: rgba(255,255,255,0.1); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.3); padding: 5px 0; letter-spacing: 0.06em; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(255,255,255,0.5); border-radius: 6px; }
.cal-day.today { background: #fff; color: #000; font-weight: 500; }
.cal-day.other-month { color: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div class="cal">
  <div class="cal-header">
    <span class="cal-title" id="cal-title"></span>
    <div class="cal-nav" style="display:flex;gap:4px;">
      <button onclick="changeMonth(-1)">←</button>
      <button onclick="changeMonth(1)">→</button>
    </div>
  </div>
  <div class="cal-grid" id="cal-grid">
    <div class="cal-dow">SUN</div>
    <div class="cal-dow">MON</div>
    <div class="cal-dow">TUE</div>
    <div class="cal-dow">WED</div>
    <div class="cal-dow">THU</div>
    <div class="cal-dow">FRI</div>
    <div class="cal-dow">SAT</div>
  </div>
</div>
<script>
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
let cur = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Taipei'}));

function render() {
  const year = cur.getFullYear();
  const month = cur.getMonth();
  const todayTW = new Date(new Date().toLocaleString('en-US', {timeZone: 'Asia/Taipei'}));
  document.getElementById('cal-title').textContent = `${year}  ${MONTHS[month]}`;
  const grid = document.getElementById('cal-grid');
  grid.querySelectorAll('.cal-day').forEach(d => d.remove());
  const first = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  for (let i = 0; i < first; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.textContent = daysInPrev - first + i + 1;
    grid.appendChild(d);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;
    if (d === todayTW.getDate() && month === todayTW.getMonth() && year === todayTW.getFullYear()) el.classList.add('today');
    grid.appendChild(el);
  }
  const total = first + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remaining; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.textContent = i;
    grid.appendChild(d);
  }
}

function changeMonth(dir) {
  cur = new Date(cur.getFullYear(), cur.getMonth() + dir, 1);
  render();
}

render();
</script>
</body>
</html>
